name: ZCS 자동 검증 (Java)

# ZeroCheck SBOM이 이 PR을 열면서 자동으로 추가한 워크플로우입니다.
# pom.xml에서 올린 의존성 버전이 이 프로젝트의 Java 17 환경에서 실제로 컴파일되는지 확인합니다.
on:
  pull_request:
    branches:
      - "main"

jobs:
  zcs-verify-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 의존성 해결 + 컴파일 확인 (Java 17)
        run: mvn -B compile
